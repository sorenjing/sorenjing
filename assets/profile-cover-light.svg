<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Soren profile cover</title>
  <desc id="desc">A bold cobalt profile cover with an assembled S monogram and a quote from Tennyson.</desc>
  <defs>
    <clipPath id="monogram">
      <text x="825" y="374" font-family="Arial, Helvetica, sans-serif" font-size="386" font-weight="900" letter-spacing="-30">S</text>
    </clipPath>
  </defs>

  <rect width="1200" height="460" rx="20" fill="#F4F6FF"/>
  <rect x="18" y="18" width="1164" height="424" rx="12" stroke="#151823" stroke-opacity="0.16"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="66" fill="#151823" font-size="12" font-weight="700" letter-spacing="2.8">SORENJING / GITHUB</text>
    <text x="1142" y="66" text-anchor="end" fill="#5C6375" font-size="12" letter-spacing="2.2">UESTC · SOFTWARE ENGINEERING</text>

    <text x="54" y="221" fill="#151823" font-size="112" font-weight="800" letter-spacing="-7">SOREN</text>
    <text x="60" y="263" fill="#3158E7" font-size="18" font-weight="700" letter-spacing="4.4">PRODUCTS / SYSTEMS / INTERFACES</text>

    <text x="60" y="348" fill="#151823" font-size="25" font-weight="600">I am a part of all that I have met.</text>
    <text x="60" y="380" fill="#5C6375" font-size="12" letter-spacing="1.7">ALFRED, LORD TENNYSON · ULYSSES</text>
  </g>

  <g clip-path="url(#monogram)">
    <rect x="778" y="44" width="356" height="82" fill="#3158E7"/>
    <rect x="778" y="126" width="356" height="70" fill="#6F89F2"/>
    <rect x="778" y="196" width="356" height="66" fill="#B5C1FA"/>
    <rect x="778" y="262" width="356" height="74" fill="#FF6B4A"/>
    <rect x="778" y="336" width="356" height="68" fill="#151823"/>
  </g>

  <g fill="#3158E7">
    <rect x="750" y="104" width="14" height="14" rx="3"/>
    <rect x="1125" y="152" width="9" height="9" rx="2"/>
    <rect x="778" y="388" width="11" height="11" rx="2"/>
  </g>
  <rect x="114" y="413" width="972" height="3" rx="1.5" fill="#3158E7"/>
  <circle cx="60" cy="414.5" r="5.5" fill="#FF6B4A"/>
  <circle cx="1140" cy="414.5" r="5.5" fill="#151823"/>
</svg>
