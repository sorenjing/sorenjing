<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Soren — an editorial profile cover</title>
  <desc id="desc">A restrained typographic cover with a continuous blue path representing experiences converging over time.</desc>
  <rect width="1200" height="420" fill="#F3F0E8"/>

  <g stroke="#191919" stroke-opacity="0.13" stroke-width="1">
    <path d="M48 32V388"/>
    <path d="M400 32V388"/>
    <path d="M760 32V388"/>
    <path d="M1152 32V388"/>
    <path d="M48 32H1152"/>
    <path d="M48 388H1152"/>
  </g>

  <g fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.4">
